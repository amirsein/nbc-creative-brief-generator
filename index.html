<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBC Creative Brief Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; }
  
  .header { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 20px 32px; display: flex; align-items: center; gap: 12px; }
  .header-logo { width: 36px; height: 36px; background: #2563eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: white; }
  .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .header span { font-size: 13px; color: #666; margin-left: 8px; }

  .main { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  
  /* API Key section */
  .api-key-bar { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 16px 20px; margin-bottom: 28px; display: flex; align-items: center; gap: 12px; }
  .api-key-bar label { font-size: 13px; color: #888; white-space: nowrap; }
  .api-key-bar input { flex: 1; background: #0f0f0f; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; color: #e8e8e8; font-size: 13px; font-family: monospace; }
  .api-key-bar input:focus { outline: none; border-color: #2563eb; }

  /* Form */
  .form-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 28px; margin-bottom: 28px; }
  .form-card h2 { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  .form-card .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; }
  
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input, .form-group textarea, .form-group select {
    background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 10px 14px; color: #e8e8e8; font-size: 14px; font-family: inherit;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #2563eb; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group .hint { font-size: 11px; color: #555; }

  .generate-btn {
    width: 100%; padding: 14px; background: #2563eb; color: white; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px;
    transition: background 0.15s;
  }
  .generate-btn:hover:not(:disabled) { background: #1d4ed8; }
  .generate-btn:disabled { background: #1e3a7a; color: #4a6fa5; cursor: not-allowed; }

  /* Loading */
  .loading { text-align: center; padding: 60px 20px; }
  .loading-spinner { width: 40px; height: 40px; border: 3px solid #2a2a2a; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: #666; font-size: 14px; }

  /* Error */
  .error { background: #1a0f0f; border: 1px solid #5c1f1f; border-radius: 10px; padding: 16px 20px; margin-bottom: 24px; color: #f87171; font-size: 14px; }

  /* Brief cards */
  .briefs-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .briefs-header h2 { font-size: 20px; font-weight: 700; color: #fff; }
  .briefs-header span { font-size: 13px; color: #666; }

  .brief-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
  .brief-header { background: #111; border-bottom: 1px solid #2a2a2a; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .brief-header h3 { font-size: 14px; font-weight: 700; color: #fff; }
  .brief-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .badge-pain { background: #3b1f1f; color: #f87171; }
  .badge-benefit { background: #1a3b1f; color: #4ade80; }
  .badge-objection { background: #3b2a1f; color: #fb923c; }
  .badge-challenge { background: #1f2a3b; color: #60a5fa; }
  .badge-identity { background: #2a1f3b; color: #c084fc; }
  .badge-default { background: #2a2a2a; color: #888; }

  .brief-body { padding: 20px; }
  .brief-section { margin-bottom: 20px; }
  .brief-section:last-child { margin-bottom: 0; }
  .section-label { font-size: 11px; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .framework-tag { display: inline-block; background: #1e2a3b; color: #60a5fa; border: 1px solid #2a3f5c; border-radius: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; }

  .hook-text { font-size: 16px; color: #fff; line-height: 1.5; font-weight: 500; }
  .hook-s1 { color: #e8e8e8; }
  .hook-s2 { color: #93c5fd; }

  .copy-block { background: #0f0f0f; border: 1px solid #222; border-radius: 8px; padding: 14px; }
  .copy-row { margin-bottom: 14px; }
  .copy-row:last-child { margin-bottom: 0; }
  .copy-row-label { font-size: 11px; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .copy-row-text { font-size: 13px; color: #ccc; line-height: 1.6; }

  .static-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .static-item { background: #0f0f0f; border: 1px solid #222; border-radius: 8px; padding: 12px; }
  .static-item-label { font-size: 10px; color: #555; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .static-item-text { font-size: 13px; color: #ccc; line-height: 1.5; }
  .headlines { grid-column: 1 / -1; }

  .higgsfield-box { background: #0a0f1a; border: 1px solid #1e3a5c; border-radius: 8px; padding: 14px; }
  .higgsfield-text { font-size: 13px; color: #93c5fd; line-height: 1.6; }

  .brief-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #222; }
  .btn-copy { background: #1e2a1e; color: #4ade80; border: 1px solid #2a4a2a; border-radius: 6px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-copy:hover { background: #2a3a2a; }
  .btn-copy-prompt { background: #1e2a3b; color: #60a5fa; border: 1px solid #2a3f5c; border-radius: 6px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn-copy-prompt:hover { background: #243050; }
  .copied { background: #0d1f0d !important; color: #86efac !important; }

  .divider { border: none; border-top: 1px solid #2a2a2a; margin: 8px 0 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">NBC</div>
  <h1>Creative Brief Generator</h1>
  <span>Powered by Imperium Acquisition Framework</span>
</div>

<div class="main">
  <div class="api-key-bar">
    <label>Anthropic API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." />
  </div>

  <div class="form-card">
    <h2>Client Intake Form</h2>
    <p class="subtitle">Fill in the client details below to generate 5–8 ad creative briefs.</p>
    
    <div class="form-grid">
      <div class="form-group">
        <label>Business Name</label>
        <input type="text" id="businessName" placeholder="e.g. Glow Med Spa" />
      </div>
      <div class="form-group">
        <label>Industry / Niche</label>
        <input type="text" id="industry" placeholder="e.g. Med Spa" />
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="location" placeholder="e.g. Austin, TX" />
      </div>
      <div class="form-group">
        <label>What They Sell</label>
        <input type="text" id="service" placeholder="e.g. Botox & lip filler" />
      </div>
      <div class="form-group full">
        <label>The Result Clients Get</label>
        <input type="text" id="result" placeholder="e.g. Look 5-10 years younger, naturally refreshed without looking 'done'" />
      </div>
      <div class="form-group full">
        <label>Social Proof</label>
        <textarea id="socialProof" placeholder="Real numbers, names, timeframes, results. e.g. 'Sarah, 42 — got Botox in 45 min, said she looked 8 years younger. 200+ clients in 6 months.'"></textarea>
      </div>
      <div class="form-group full">
        <label>USPs / Differentiators</label>
        <textarea id="usps" placeholder="What makes this business different? e.g. Board-certified injectors only, same-day appointments, natural results guarantee"></textarea>
      </div>
      <div class="form-group full">
        <label>Customer Pain Points (in their words)</label>
        <textarea id="painPoints" placeholder="How do frustrated customers describe their problem? Use their exact language if possible. e.g. 'I feel invisible', 'I look tired even when I'm not', 'I hate how old I look in photos'"></textarea>
      </div>
      <div class="form-group full">
        <label>Objections They Hear</label>
        <textarea id="objections" placeholder="Common reasons people don't book. e.g. 'It'll look fake', 'Too expensive', 'What if it goes wrong', 'I don't have time for recovery'"></textarea>
      </div>
      <div class="form-group full">
        <label>Audience Description</label>
        <textarea id="audience" placeholder="Who is the ideal customer? e.g. Women 35-55, professional, active on social media, already spend on self-care, want to look as young as they feel"></textarea>
      </div>
      <div class="form-group">
        <label>Tone Preference (optional)</label>
        <select id="tone">
          <option value="">— Select tone —</option>
          <option value="professional">Professional</option>
          <option value="casual">Casual / Conversational</option>
          <option value="direct">Direct / No-fluff</option>
          <option value="educational">Educational / Informative</option>
          <option value="empowering">Empowering / Uplifting</option>
        </select>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateBriefs()">
      Generate Creative Briefs →
    </button>
  </div>

  <div id="output"></div>
</div>

<script>
const KNOWLEDGE_BASE = "\n\n=== SOURCE: (IA) Video 1 - Meta Ad Methodology.docx.pdf ===\nModule 3 - Modern Meta Methodology\nClick here for Google Doc (Click File > Make a Copy)\nIntroduction \u25b6\nWelcome to Module 3 - Creating Winning Ads.\nIn this module we are going to take a deep dive into the modern way of running Meta ads.\nWhether you\u2019re brand new to Meta Ads or you\u2019ve run campaigns before, this module will show\nyou the approach you should be taking to consistently get results in the current Meta ecosystem.\nWe\u2019ll move away from outdated ideas around heavy targeting and focus on what really matters\nnow.\nCreative, messaging, and how the algorithm responds to your ads.\nBy the end of this module, you\u2019ll understand how to think about ad creation, testing, and iteration\nin a way that aligns with how Meta delivers ads today and not outdated methods you\u2019ve likely\nseen or learnt before.\nModern Meta \u26a1\nIn this video we\u2019re going to talk about how Meta Ads actually work today and why the biggest\ndriver of performance is no longer targeting, but creative.\nA lot of advertisers still approach Meta the way it worked years ago, focusing heavily on\ninterests, audiences, and complex targeting setups.\nThe reality is that Meta has changed.\nDue to privacy updates, data restrictions, and the scale Meta now operates at, the platform\nrelies far more on its algorithm to decide who sees your ads.\nInstead of you telling Meta exactly who to target, Meta now learns who responds to your ads\nby analysing how people interact with your creative.\nThis means your ads themselves play the biggest role in determining performance.\nCreative Targeting \ud83e\uddf1\nTo understand the way Meta operates today we first need to understand where it came from\nand how it has developed.\nIn the past Meta relied heavily on audience targeting to decide who should see your ads.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nMedia buyers would build campaigns with multiple ad sets, each one targeting a different\ninterest, demographic, or lookalike audience.\nThe goal was to find small pockets of people who were likely to convert by narrowing\ntargeting as much as possible.\nMost of the testing happened at the ad set level and not the creative level.\nThe same ads were often duplicated across multiple ad sets, with the only variable being the\naudience.\nIf performance was poor, the assumption was that the targeting was wrong, not the ad.\nThis approach worked when Meta had access to far more user-level data and targeting\nsignals.\nThis structure also came with many downsides.\n\u2022 Slow learning due to fragmented audiences\n\u2022 Budget spread thin across many ad sets\n\u2022 Limited creative testing\n\u2022 Heavy manual optimisation\nAs privacy changes reduced the effectiveness of interest and demographic targeting, this\nstructure became less reliable.\nMeta could no longer depend on narrow audience definitions to drive performance.\nBecause of this Meta had to come up with a new way to drive ad performance so that it\ncould still offer a reliable service to advertisers.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nInstead of targeting people directly, Meta started learning who to show ads to based on how\npeople responded to the creative itself.\nCreative is now the primary driver of Meta ad performance.\nWhat Do We Mean By Creative \ud83d\udd8a\ud83d\udcf9\ud83d\uddbc\nCreative is a term you will hear a lot when it comes to ads and it\u2019s really important we clarify\nwhat we actually mean by this.\nIt\u2019s not just the visual elements of an ad and how it looks and there are a number of\ncomponents that make an ad creative.\nCreative is the full message being communicated to the person seeing the ad.\nMeta doesn\u2019t just analyse whether someone watched a video or clicked an image.\nIt analyses how people respond to the idea being presented.\nYour creative is going to be made up of several elements working together.\n\u2022 The hook\nThe first line, opening frame, or visual that stops the scroll.\n\u2022 The angle\nThe perspective you\u2019re taking on the problem, desire, or opportunity.\nDifferent angles attract different types of people.\n\u2022 The message\nWhat you\u2019re actually saying. The story, explanation, or promise being made.\n\u2022 The framing\nHow the message is positioned. This could be educational, direct, emotional, logical,\naspirational, or problem-focused.\n\u2022 The format\nVideo, static image, UGC, talking head, screen recording, text-led, carousel.\nDifferent formats create different engagement patterns. In this module we will cover how to\ncreate winning ads across both video and static formats, including how to write copy and\nstructure messaging for each.\n\u2022 The call to action\nWhat you\u2019re asking someone to do next and how clearly that\u2019s communicated.\nThese are all elements that influence how people interact with your ad.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWe can have two ads that look really similar, but if the hook, angle or framing changes they\ncan perform completely differently.\nThis is why Meta can deliver these ads to completely different people.\nWe\u2019re not just showing people different visuals to see what gets people taking action.\nThe algorithm is reacting to behaviour triggered by the different messaging.\nUnderstanding this is critical.\nBecause when you change the creative, you\u2019re not just changing how the ad looks. You\u2019re\nchanging who the algorithm learns to show it to.\nHow Meta Uses Creative Signals to Find Buyers Today \ud83c\udfa3\nMeta\u2019s ad delivery system is built to constantly learn and adjust based on how people\nrespond to your creative.\nAt a high level, Meta looks at ad performance and uses those signals to decide who should\nsee your ads next.\nEvery interaction sends information back to the system.\nThis includes:\n\u2022 How quickly someone stops scrolling\n\u2022 How long they watch a video\n\u2022 Whether they engage with the ad\n\u2022 Whether they click\n\u2022 Whether they convert\nMeta is constantly looking at these signals and looking for patterns or user behaviour.\nIf people respond well it can then increase delivery of that ad to similar users. Or, if people\ndon\u2019t respond well it can reduce delivery.\nThis is constantly happening in the background and is the system Meta now uses to drive all\nad performance.\nYou will likely have heard this referred to as \u2018andromeda\u2019.\nMeta does not optimise around interests or demographics in the same way it used to.\nIt optimises around how people respond to ads.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n- Your ad is the input.\n- User behaviour is the signal.\n- The algorithm is the decision-maker.\nThis is why two ads in the same campaign can attract completely different types of people,\neven when targeting is identical.\nFor example, one ad might attract people who respond to social proof and authority, while\nanother attracts people who respond to speed and simplicity.\nEven with identical targeting, Meta will learn these patterns and deliver each ad to different\nsubsets of users.\nThe creative itself determines who the algorithm finds.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nCreative fatigue, messaging shifts, and angle testing matter more than ever.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWhen performance drops, it\u2019s usually because the creative signals have weakened, not\nbecause the targeting is wrong.\nCreative fatigue isn\u2019t just people getting bored. It\u2019s the point where the signals your ad sends\nbecome weaker, causing Meta to reduce delivery.\nUnderstanding this changes how you approach testing, scaling, and optimisation.\nAnd it\u2019s the foundation for everything else we\u2019re going to cover in this module.\nAI Driven targeting \u2699\nMeta has been gradually bringing in new AI tools into its system for a while now.\nThis includes things like:\n- Adv+ campaigns\n- Ad level AI tools\n- AI bid adjustments\nThese tools have all been designed with Meta new ways of learning in mind.\nEach one gives the algorithm more freedom to find different pools of people and learn about\nwhere your ads will perform best.\nWhen you heavily restrict targeting, you limit the number of people Meta can test your ads\nagainst.\nThis slows learning and makes it harder for the algorithm to find patterns.\nBroad audiences allow Meta to observe how different types of people respond to your\ncreative and quickly adjust delivery based on real behaviour.\nInstead of pre-filtering people with interests or demographics, you let the algorithm do the\nfiltering for you.\nYour ad is the filter.\nIf your ad and creative is strong you will naturally attract the right audience and repel the\nwrong one.\nWhen targeting is too narrow:\n\u2022 Meta has less data to work with\n\u2022 Learning takes longer\n\u2022 Performance becomes unstable\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\u2022 Scaling becomes harder\nWhen targeting is broader:\n\u2022 Meta can test faster\n\u2022 Patterns emerge more clearly\n\u2022 Winning creatives are identified sooner\n\u2022 Scaling is smoother\nHowever, we can still use some targeting elements when they are relevant.\nFor instance we might need to exclude certain age ranges if we are selling a product or\nservice that isn't suitable.\nThink of your audience targeting as who can see your ad.\nThink of your creative determining who will see the ad.\nYou can use audiences as guardrails\nYour creative is the lever.\nYour key to success with Meta is now going to be around:\n- Volume\n- Variation\n- Testing\nNew Account Structure \ud83e\uddf1\nAccount structure is now focused around:\n- Fewer adsets\n- Broader targeting\n- More creative variations\n- Testing takes place at ad level not audience level.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWhat\u2019s Next \u23ef\nNow that you understand why creative drives performance on Meta, you have the foundation\nfor everything else in this module. Creative is the input. Behaviour is the signal. The\nalgorithm is the decision-maker. Every lesson from here builds on that.\nIn the next video we are going to break down ad angles. You will learn what an angle is, why\ndifferent angles attract different people, and how to use them as the strategic foundation for\nall your creative testing.\nYou\u2019ll learn how to think about angles, how to structure creative testing around them, and\nwhy testing angles is far more effective than testing audiences.\nThis is going to be the core of your creative strategy.\nEverything we\u2019ve covered in this video sets the foundation for how you\u2019ll approach ad\ncreation, testing, and iteration moving forward.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\n\n=== SOURCE: (IA) Video 2 - Ad Angles (1).docx.pdf ===\nModule 3 - Ad Angles\nClick here for Google Doc (Click File > Make a Copy)\nIntroduction \u25b6\nIn this video we are going to talk about Ad Angles.\nAn angle is all about framing the same offer in different ways, speaking to different emotions and\ntriggering different behaviours.\nIf our creative is how we target different audiences, then our ad angle is how we tell Meta who to\nlook for.\nDifferent types of angles attract different types of people and this is crucial with Meta\u2019s focus on\ncreative targeting.\nI'm going to teach you what an ad angle actually is, how to think about angles strategically, and\nhow to use them to structure your creative testing.\nMy goal is to get you creating ads with intent and purpose and move away from random testing.\nBy the end of this video you should be able to break down any offer into multiple angles and\nunderstand how to use them to drive performance on Meta.\nWhat Is An Ad Angle? \ud83d\udcd0\nAn angle is the specific way you present your offer, message or idea inside an ad.\nWe\u2019re not talking about the product or the format here, but specifically the perspective you\nchoose to present it from.\nAny product or service can be presented in multiple ways depending on what you choose to\nemphasise.\nIt\u2019s each of these presentations that is an angle.\nThese angles are incredibly important as everybody is going to have different needs, desires\nand messaging that they resonate with.\nLet\u2019s use a fitness coaching business as an example and imagine they are selling a 30 day\nbody transformation package.\nThere are multiple ways we can present this.\n- Speed > Get back in shape in 30 days without spending hours in the gym.\n- Simplicity > A simple fitness plan for busy people who hate complicated workouts.\n- Authority> The same system used by over 1,000 successful clients.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n- Enjoyment> Get in shape using this fun and addictive workout routine.\n- Benefit > Improve your body confidence with this workout routine.\nThese could all use the same format or same offer.\nThe thing that changes is the idea that is being communicated.\nThis can completely change the type of person that is attracted.\nThe outcome is the same but the mental entry point changes.\nAngles vs creatives \ud83d\udcd0 \ud83d\uddbc\nAn angle is the idea\nA creative is how that idea is expressed\nOne angle = Many creatives\nOne Creative = Only one angle\nThis also means that the same angle can be expressed as a video ad, a static image, or a\ncarousel.\nThe format changes. The core idea does not.\nThis is important to understand because later in the module we will look at how to write and\nstructure ads for both formats.\nCreating Ad Angles For Your offer \ud83d\udd8a\nWhen creating ad angles, we start by understanding the core problem our offer solves and\nthe different ways people emotionally experience that problem.\nRather than jumping straight into writing ads, we want to break our understanding down into\na set of clear inputs we can use to build strong angles.\nThese inputs act as ingredients. On their own they don\u2019t create angles, but when combined\nthey form clear ideas we can test.\nThis gives us a structured way to approach ad creation instead of relying on guesswork or\nrandom testing.\nWe can start by mapping these inputs and then work out how our specific offer fits into each\none.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n- Pain Points \ud83d\udea8\nThese focus on a specific problem, frustration, or sticking point and they work by making the\nviewer feel understood.\n- Overweight\n- Don't like the way they look\n- Clothes don't fit me\n- Struggle to move\n- Benefits \u2705\nThese focus on a specific outcome the viewer is looking for. They work by showing what life\nlooks like after the problem is solved.\n- More confidence\n- More energy\n- Wear smaller clothes size\n- Objection handling \u274c\nThese angles directly address common reasons people don\u2019t buy and they work by\nremoving mental barriers.\n- Don't have time\n- Too expensive\n- Need to be fit\n- Challenges \u26a0\nChallenges are based on what someone has already tried and failed with.\nThey are backward-looking and emotional and they acknowledge effort, frustration, and\ndisappointment.\n- Followed diets that were too strict\n- Got results but they didnt last\n- Identity \ud83e\uddd4\nThese angles focus on how someone sees themselves or wants to see themselves and work\nby aligning the offer with their identity.\nThey can relate to someone's lifestyle, experience or values. We can also refer to what\nsomeone \u2018should not be\u2019.\n- busy professionals\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n- Not for extreme dieters\nRemember, angles are not audiences. Multiple audiences can respond to the same angle,\nand Meta will decide who responds based on the creative signals.\nMapping Out Your Angles \ud83d\uddfa\nI\u2019ve created a worksheet for you that's going to allow you to map out everything you need to\ncreate your own angles for your own offers.\nThis is an awesome exercise you can actually include in your client onboarding to get them\ninvolved in the process.\nThere\u2019s also some sections in this worksheet that are going to help us gather other\ncomponents we need for building our high performing creatives, including social proof and\nUSPs.\nPrioritising angles \ud83d\udcca\nNot all angles are created equal and you will likely have more than you can realistically test\nin one go.\nYou don't need to test everything at once and you\u2019ll need to work out what to test first.\nWe can prioritise the order to test them using 3 simple filters.\n1. Strength of the pain\nStart with angles that connect directly to a strong, emotionally charged pain point.\nIf someone feels this problem regularly or it affects their confidence, energy, or daily life, it\u2019s\nusually a good place to start.\nStrong pain = faster feedback.\n2. The amount of people it applies to\nAsk yourself how many people this angle could apply to.\nBroad angles tend to work best early on because they give Meta more room to find\nresponders.\nHighly specific angles can work well later, but they are usually better tested after you\u2019ve\nfound something that performs at scale.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n3. How believable it is\nPrioritise angles that feel realistic and easy to accept.\nIf an angle requires a big leap of faith, heavy explanation, or sounds too good to be true, it\u2019s\nharder for people to engage with quickly.\nClear, believable ideas usually outperform clever or extreme ones.\nWhen choosing your first angles to test:\n- Pick 5 angles that score highly across all three filters\n- Start with broad, obvious ideas before niche or complex ones\n- Save abstract or advanced angles for later rounds of testing\nWe want to learn which angles meta responds to fastest and then we can build into more\ncomplex ideas from there.\nFrom our examples:\n\u201cFear of staying overweight because they don\u2019t have accountability and finally having a\nsystem that keeps them consistent.\u201d\nThis fits all three well.\n- Being overweight is a strong pain\n- Accountability applies to nearly everyone\n- It\u2019s believable as we have the mechanism to prove it.\nWe might want to avoid talking about \u201cbeach bodies\u201d as this may only apply to a smaller\nproportion of people who are going away or live near a beach.\nRemember, this isn't our hook or ad copy yet. We will work on the language and wording\nnext.\nSummary \u2714\nAn angle is the specific perspective you choose to present your offer from. It is not the\nformat, not the hook, and not the copy. It is the core idea.\nOne angle can generate many creatives across many formats. One creative only ever\nexpresses one angle.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nYou build angles from five inputs: pain points, benefits, objection handling, challenges, and\nidentity.\nMap your offer against all five, then prioritise based on strength of pain, breadth of\napplicability, and believability.\nStart with the angles that score highest across all three before moving to more specific or\ncomplex ideas.\nRemember: angles are not audiences. Meta decides who responds. Your job is to give it\nstrong, clear ideas to work with.\nWhat\u2019s Next \u25b6\nNow that you\u2019ve mapped and prioritised your angles, you\u2019ve done the strategic work.\nYou know what ideas you want to test and why those ideas matter.\nThe next step is turning those angles into something people actually stop and pay attention\nto.\nIn the next video, we\u2019re going to break down hooks.\nYou\u2019ll learn how to take a single angle and turn it into multiple hooks that grab attention, stop\nthe scroll, and give Meta the signals it needs to find the right people.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\n\n=== SOURCE: (IA) Video 3 - Writing Hooks That Catch (1).docx.pdf ===\nModule 3 - Writing Hooks That Catch\nClick here for Google Doc (Click File > Make a Copy)\nIntroduction \u25ba\nIn this video I\u2019m going to teach you all about hooks.\nA hook is the first thing someone sees or hears in your video ads, and it decides whether they\nstop scrolling or ignore you completely.\nThis is usually going to be the first 1-2 lines of speech in your video ads but could also be the\nmain title in a graphic, or first line or two of text in an ad depending on what format you are using.\nIt doesn\u2019t matter how good your offer is or how strong your angle is. If the hook doesn\u2019t earn\nattention no one will see the rest of the ad.\nIn this lesson I\u2019m going to show you what a hook actually is, what its job is, and why most hooks\nfail.\nWe\u2019ll break down the difference between good hooks and bad hooks, how to avoid curiosity\nclickbait that attracts the wrong people, and the common mistakes that kill ad performance.\nI\u2019ll also show you how to turn the ad angles you\u2019ve already mapped out into clear, effective\nhooks, using simple formulas you can apply over and over again.\nThe goal is to create hooks that immediately tell the right person, \u201cthis is for you\u201d, and give Meta\nthe clear signals it needs to find more people like them.\nBy the end of this video, you should be able to look at any angle and confidently turn it into\nmultiple hooks that catch attention and set your ads up for success.\nWhat Is A Hook \ud83c\udfa3\nPut simply: your hook is the opening of your ad and its job is to earn a few seconds of attention\nfrom the right person.\nIt\u2019s not your headline and it\u2019s not about trying to be clever, shocking or entertaining.\nI want you to look at hooks as filters. A good hook doesn\u2019t try to attract everyone. It tries to\nquickly attract the right person and repel everyone else.\nIt quickly tells the viewer:\n- What this ad is about\n- Who it\u2019s for\n- Why they should keep watching\nThe hook is the most important part of your creative.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nIf the hook does its job properly the right people stick around for the full ad.\nIf it doesn\u2019t they could potentially be scrolling past and the rest of the ad won\u2019t have any chance\nto perform.\nThink of it like the cover of a book. It needs to catch the attention of the reader and give them an\nidea of what the book is about. If it doesn\u2019t they won't open it and read it.\nThe Job Of A Hook\nHooks have two main jobs to achieve.\n- Clarity: The viewer to immediately understand what the ad is about\n- Curiosity: The viewer feels like this is relevant to them and worth their attention.\nIf you have curiosity without clarity, people are confused.\nIf you have clarity without curiosity, people are bored.\nBy using a strong hook we balance both. It makes the viewer think:\n\u201cThis is about my problem.\u201d\n\u201cAnd this might actually help me.\u201d\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWhy Hooks Matter On Meta \ud83d\udcad\nHooks are absolutely essential to ad performance on Meta.\nThis is because Meta looks at how people respond to your ad in the first few seconds.\n- Who stops.\n- Who watches.\n- Who engages.\n- Who leaves immediately.\nThose early reactions tell Meta who your ad is relevant to and teaches it who to show your\nads to next.\nThis is why it's so important to make sure our Hooks are attracting the right people, and\nfiltering out people we don't want.\nFor instance, if we had a hook that was \u2018clickbaity\u2019 and drove a lot of curiosity but had no\nclarity we could have a lot of irrelevant clicks.\nThis in turn provides bad feedback to the algorithm.\nIn short:\n- Your angle decides who the ad is for.\n- Your hook decides whether they pay attention.\nIf your hook is weak the angle never gets a chance.\nCommon Hook Mistakes \u274c\nMost hooks fail for one of four main reasons.\nIf you can identify which one is happening then fixing it becomes really obvious.\nYou don\u2019t need to be clever, just keep it simple and avoid these four mistakes.\n1. Delay \u231b\nDelay happens when the hook takes too long to introduce what the ad is actually about.\nThe first line is vague, emotional, or \u201cwarming up\u201d instead of giving context.\nExamples of delay:\n\u201cThis is one of the craziest things I\u2019ve ever seen\u2026\u201d\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\u201cYou won\u2019t believe what happened when\u2026\u201d\nThese lines create curiosity, but they give the viewer no information to decide if they should\nkeep watching.\nLots of videos you see online suffer from this issue and now you are aware of it you will likely\nsee it everywhere.\nOn Meta, those first 1\u20132 seconds matter most. Every second without clarity causes people to\nscroll past.\nWhy this kills performance:\nIf the viewer doesn\u2019t know what the video is about immediately, they can\u2019t decide to opt in.\nCuriosity without context = uncertainty.\nUncertainty = scrolling.\nHow to fix it:\nMake sure you introduce the topic in the first sentence\n- Cut fluff.\n- Cut warm-ups\n- Increase your speed to value.\nGood examples:\n\u201cIf you\u2019re struggling to lose weight, this is why it keeps coming back.\u201d\n\u201cHere are three simple ways to lose fat without living in the gym.\u201d\n2. Confusion \u2753\nWhat this looks like\nThe hook introduces the topic, but the wording is unclear, overcomplicated, or awkward.\nThe viewer hears the words, but doesn\u2019t fully understand what you mean.\nThis usually happens when:\n- Sentences are too long\n- Too many ideas are packed into one line\n- Passive or abstract language is used\nFor example:\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\u201cThis business owner doubled their appointments using a 30 day process that is impossible\nto learn unless you have a AI appointment setter like they did\u201d\nWhy this kills performance:\nIf the viewer can\u2019t quickly understand the hook, they can\u2019t assess relevance.\nIf they have to \u201cthink\u201d to understand it, they won\u2019t.\nConfusion creates friction, and friction kills retention.\nHow to fix it:\nWe need to make sure we are writing for clarity and not to be clever.\n- Use simple language\n- Use fewer words\n- Use active voice\n- Aim for a 6th-grade reading level\nOur example could now read something like:\n\u201cThis business owner doubled their monthly appointments in just 30 days using this AI\nappointment setter\u201d\nQuick test:\nRead your hook in isolation.\nIf it could be interpreted in more than one way, or it doesn't have immediate meaning.\nRewrite it.\n3. Irrelevance \ud83e\udd37\nIrrelevance happens when the hook is clear, but the viewer doesn\u2019t feel confident the video\nis for them.\nThey understand the topic, but they\u2019re unsure if what\u2019s coming next will actually help their\nsituation.\nThis often happens when hooks are framed around:\n\u201cI\u201d and \u201cme\u201d\nThis happens when we focus on the creator\u2019s story instead of the viewer\u2019s problem or, use\ngeneric statements instead of specific pain points.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWhy this kills performance:\nIf the viewer doesn\u2019t see themselves in the hook, they won\u2019t invest attention.\nThey ask themselves:\n\u201cIs this actually relevant to me?\u201d\nIf the answer isn\u2019t immediately \u201cyes\u201d, they scroll.\nHow to fix it:\nFrame hooks around the viewer.\n- Use \u201cyou\u201d and \u201cyour\u201d\n- Call out the situation or problem directly\n- Make the expected value obvious\nExample:\nInstead of\n\u201cI struggled with weight loss for years\u2026\u201d\nUse\n\u201cIf you struggle with weight loss\u2026\u201d\n4. Disinterest \ud83e\udd71\nThis happens when the hook is clear and relevant, but it doesn\u2019t create enough curiosity to\nkeep someone watching.\nThe viewer understands what the video is about and who it\u2019s for, but there\u2019s no reason to\nstay.\nThis usually happens when the hook:\n- States a fact without tension\n- Feels obvious or generic\n- Lacks contrast\nWhy this kills performance:\nClarity and relevance get attention.\nCuriosity keeps it.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWithout curiosity, the viewer has no reason to continue.\nHow to fix it:\nCreate contrast.\nContrast is the distance between:\nWhat they currently believe or have tried and a better, faster, or more effective alternative\nThis can be:\nStated contrast\n\u201cMost people try strict diets, but this approach actually lasts.\u201d\nImplied contrast\n\u201cThis is the easiest way to lose weight without burning out.\u201d\nContrast makes the viewer ask \u201cWhy is this different?\u201d.\nThat question keeps them watching.\nIf we take our example:\n\u201cThis business owner doubled their monthly appointments in 30 days using an AI\nappointment setter.\u201d\nIt\u2019s clear but it doesn't challenge anything yet. We can add contrast to make it stronger.\nStep 1 - We want to show the baseline belief.\nBusiness owners believe that to get more appointments, they need:\n- More ads\n- Better funnels\n- More manual follow-ups\n- More time chasing leads\nStep 2 - Introduce the contrast\nA = \u201crun more ads\u201d\nB = \u201cAI appointment setter\u201d\nWe can state it directly:\n\u201cMost business owners try to book more calls by running more ads.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nYou can double your monthly appointments in 30 days using an AI appointment setter\ninstead.\u201d\nOr, we can imply it and leave them to fill in the gaps.\n\u201cThis business owner doubled their monthly appointments in 30 days, without running more\nads by using an AI appointment setter.\u201d\nWhat\u2019s happening here:\n- You never explain the old way\n- The viewer fills in the gap themselves\n- Their brain asks: \u201cWait\u2026 then how?\u201d\nThe contrast is doing the work.\nHook Structure \u2699\nIn most high-performing hooks, contrast lives in the second sentence, not the first.\nKeep the first sentence's job as clarity and the second sentence's job as curiosity.\nIf you try to do both at once, hooks often become confusing, wordy, or unbelievable.\nTell me what it's about > Give me a reason to keep watching.\nTo keep things simple you can use the following formula.\nSentence 1 \u2192 Topic Clarity\nTell the viewer exactly what the video is about.\nSentence 2 \u2192 Contrast (Curiosity)\nChallenge what they already believe or introduce a better alternative.\nWhat\u2019s Next \u23ef\nIn the next lesson, we\u2019re going to take the angles you\u2019ve already mapped out and turn them\ninto hooks.\nI'm going to give you my simple step by step formula that you can reuse across every offer\nand every client so you always have a clear path from onboarding to execution.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nSummary \u2714\nA hook has one job: earn a few seconds of attention from the right person and give Meta the\nsignal it needs to find more people like them.\nIt is not about being clever or shocking. It is about clarity and curiosity working together \u2014\nthe first sentence tells the viewer what the ad is about, the second gives them a reason to\nkeep watching.\nThe four mistakes that kill hooks are delay, confusion, irrelevance, and disinterest. Delay\nburies the topic. Confusion forces the viewer to think. Irrelevance fails to signal who the ad is\nfor. Disinterest gives no reason to stay. Fix any one of these and performance improves\nimmediately.\nIn the next lesson we are going to take everything here and put it into practice \u2014 turning the\nangles you have already mapped out into hooks using a simple, repeatable framework.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\n\n=== SOURCE: (IA) Video 4 - Building Hooks From Angles (1).docx.pdf ===\nModule 3 - Building Hooks From Angles\nClick here for Google Doc (Click File > Make a Copy)\nIntroduction \u25b6\nIn the last lesson, we broke down what makes a hook work, why hooks matter on Meta, and the\nmost common reasons they fail.\nAt this point, you should understand what a good hook needs to do.\nIn this video, we\u2019re going to focus on how to actually build them.\nWe are going to turn the ad angles you\u2019ve already mapped out into clear, effective hooks you can\nwrite consistently, without guessing or trying to be clever.\nI\u2019m going to give you a simple builder framework and worksheet you can use to convert any\nangle into multiple hooks on demand.\nThe amazing thing about this is it gives you a clear path from onboarding > Angle Creation >\nHooks so you will always have a clear plan of what to launch and test with every account you\nrun.\nIf you\u2019ve ever stared at a blank page trying to \u201ccome up with a hook\u201d, this lesson is going to\nremove that friction completely.\nLet\u2019s get into it.\nAngles To Hooks Framework \ud83d\udee0\nEvery hook you create is going to start with your angle.\nYou already have all the information you need and we\u2019re not creating anything new here.\nWe\u2019re simply translating an angle into the first 1\u20132 lines of an ad.\nThink of it like this:\nAngle = the idea\nHook = the first expression of that idea\nOur job is to take one angle and express it clearly, quickly, and with enough contrast to earn\nattention.\nTo do that consistently, we\u2019re going to use a small set of building blocks that every strong hook is\nmade from.\nComponents \u2699\nEvery effective hook is built from the same core components.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nYou won\u2019t always use all of them, but you should always know which ones you\u2019re using and why.\nThe components are:\n- Subject\n- Action\n- Outcome / Result\n- Contrast\n- Proof (optional)\n- Time (optional)\nWe can map any angle against these 6 core components to create multiple hooks.\nThis means we aren\u2019t guessing what to say but are able to assemble our hooks from the core\ninputs that come directly from our audience's psychological states.\nWhile you might be wondering if you could just pull hooks together from the angles sheet, the\nanswer is yes you could, but with a downside.\nUsing this structure is going to force clarity and contrast into your hooks and give you structure\nand discipline for building and testing them.\nSubject \ud83d\udd8a\nWho is this about? In most Meta ads, this is usually:\n- \u201cYou\u201d\n- \u201cBusy professionals\u201d\n- \u201cBusiness owners\u201d\n- Or implied \u201cpeople trying to lose weight\u201d\nIf the subject isn\u2019t obvious, the hook won\u2019t feel relevant.\nAction \ud83d\udcaa\nWhat\u2019s happening or changing? Must be a verb\n- Losing weight\n- Staying consistent\n- Following a system\nEvery hook needs movement or something happening.\nOutcome / Result \ud83d\udcc8\nWhat do they want?\n- Finally losing weight\n- Keeping it off\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n- Feeling in control\nClear outcome = clear reason to watch.\nContrast \u27a1\nOld baseline belief vs new reality\n- Trying and quitting vs accountability\n- Willpower vs system\n- Motivation vs structure\nThis is where we build our contrast and make the hook compelling.\nProof (optional) \u2714\n- Clients / Track record\n- Experience \u201cAfter doing X\u201d\n- Volume\n- \u201cUsed by\u201d\n- \u201cagain\u201d\nTime (optional) \u231b\nHow fast does this happen?\n- In 30 days\n- If I had 12 weeks\n- Right now\n- Before you build it\nHook Assembly \u2693\nHere is my golden rule to follow when first assembling your hooks.\nRemember this is designed to keep things simple and effective, while working out which key\nmessaging points resonate with your audience.\nWe don't want to be too clever. Simplicity is key.\nSentence 1 \u2013 Clarity \u2705\nSubject + Action + Outcome.\nThe first sentence tells the viewer exactly what the video is about and who it is for. Keep it\ndirect and specific.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nSentence 2 \u2013 Curiosity \ud83e\udd14\nContrast (+ optional Proof or Time)\nThe second sentence builds contrast and gives the viewer the information they need to decide\nwhether to keep watching.\nWorksheet \u270f\nNow we\u2019re going to put this into practice.\nNow let's take a look at the worksheet and build some of these together using the previous\nangles we created. It\u2019s designed to remove all guesswork from writing hooks.\nBy the end of this worksheet, you should have 5\u201310 usable hooks per angle that you can\nimmediately test.\nNow let me show you how to use it!\nSummary \u2714\nEvery hook starts with an angle. The framework in this lesson gives you a reliable way to\ntranslate any angle into multiple hook variations without guessing. Subject, action, outcome,\ncontrast and these four components do the structural work. Proof and time add weight when\nyou have them.\nSentence 1 carries clarity. Sentence 2 carries curiosity. Keep them separate, keep them\nsimple, and use the worksheet to build five to ten hooks per angle before you launch\nanything.\nThe goal is not one great hook. The goal is a testing inventory that gives the algorithm\nenough signal to find the people who respond.\nIn the next lesson we are going to move from hooks into the full ad structure and how to take\nsomeone from attention all the way through to a click.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\n\n=== SOURCE: (IA) Video 5 - Creating Ad Scripts (1).docx.pdf ===\nModule 3 - Creating Ad Scripts & Ad Copy\nClick here for Google Doc (Click File > Make a Copy)\nIntroduction \u25b6\nIn the last few lessons, we\u2019ve already done the hardest and most important work.\nWe\u2019ve broken down your angles and we\u2019ve learned how to turn them into hooks that provide\nproper signals to meta.\nNow it\u2019s time to take those hooks and turn them into full ads that convert.\nIn this video we are going to focus on ad scripts and I am going to teach you how winning Meta\nads are actually structured, and how to turn your existing hooks into clear, believable scripts.\nThink of your script as the bridge between attention and action.\nThe hook earns the stop.\nThe script builds understanding and belief.\nAnd together, they give Meta the signals it needs to find more of the right people.\nYou\u2019ll see how each structure works, when to use it, and how it guides someone from problem to\nsolution without feeling salesy or forced.\nThen, instead of writing every script manually from scratch, I\u2019ll show you how to use AI properly\nto do the heavy lifting.\nBy the end of this video, you\u2019ll have a repeatable process you can use across every account you\nrun:\nAngles > hooks.\nHooks > scripts.\nScripts > ads.\nThis will give you a full system you can use for any client account to plan, launch and find\nwinning ads for their account without hours of manual work.\nNarrative Frameworks \u270f\nThere are many structures you can use for creating scripts.\nI'm going to give you three easy to follow structures that can be used across all your hooks\nto make multiple variations of your ads.\nThese aren't set writing templates but frameworks for thinking.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nThey follow very simple, repeatable structures that guide someone from attention to belief in\na logical way.\nFramework 1: Problem \u2192 Solution \ud83d\ude1f\u27a1 \ud83d\ude42\nThis is the most direct framework, and it works best when the pain is already obvious.\nYou start by clearly describing the problem the viewer is experiencing.\nYou show them that you understand what\u2019s frustrating, why it keeps happening, and what it\u2019s\ncosting them if nothing changes.\nThen you introduce the solution as a logical response to the problem you\u2019ve just outlined.\nThis framework works especially well when:\n- The audience already knows they have a problem\n- They\u2019ve tried things before and failed\n- The angle is rooted in frustration, burnout, or inconsistency\nFramework 2: Before \u2192 After \u2192 Bridge \ud83d\ude4c\nThis framework is all about contrast.\nYou paint a clear picture of what life looks like before and focus on audience pain points.\nThis could be the high amount of effort vs low reward, the struggle, the constant restarting.\nThen you show what life looks like after. This needs to be realistic and grounded. Not hypey.\n- More ease.\n- More consistency.\n- More progress\nOnce the contrast is clear, you use the bridge to explain how that change happens.\nThe bridge = your system, offer, or method.\nThis framework works best when:\n- You want to show transformation without exaggeration\n- The angle is about sustainability or long-term change\n- You want the viewer to emotionally feel the difference\nThe \u201cafter\u201d needs to be believable, not an unachievable fantasy. We can also use social\nproof to help support this.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nIf it feels realistic, it builds trust.\nFramework 3: Myth \u2192 Truth \ud83e\udd25\nThis framework works when the audience is stuck believing something that\u2019s holding them\nback.\nYou start by calling out a common belief. This could be something they\u2019ve heard before or\nsomething they probably believe is true.\nThen you introduce the truth in a calm and clear way.\nYou explain why the old belief doesn\u2019t work, and what actually does.\nThis framework works best when:\n- The angle challenges a common assumption\n- The audience is stuck repeating the same mistakes\n- You want to reposition how they think about the problem\nThis is especially powerful when paired with education-based offers or systems.\nNo matter which framework you use, the job of the script is always the same:\n- Build understanding\n- Build belief\n- Make the next step feel obvious\nThe script does not need to convince everyone and it only needs to make sense to the right\nperson.\nThe Full Ad Structure \u2699\nThe three frameworks above give you the narrative shape of an ad. Now we are going to\nadd a complete sequential structure that turns that narrative into a full ad you can build\nelement by element.\nThis structure works across all three frameworks and can be applied to both video scripts\nand written copy for statics. Think of it as a blueprint. The frameworks tell you the story to\ntell. This structure tells you in what order to tell it.\nHook \u2693\nThe hook is the opening of the ad. Its job is to stop the scroll, signal who the ad is for, and\ncreate enough curiosity or clarity to earn the next few seconds of attention.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nYou have already built your hooks using the angle and hook framework. This is where they\ngo.\nProblem Agitation \ud83d\udea8\nOnce you have the viewer's attention, you deepen the pain.\nYou are not just naming the problem. You are making the viewer feel the weight of it.\nHow long have they had it? What has it cost them? What have they already tried that has not\nworked? What happens if nothing changes?\nThis is the part of the ad that creates emotional investment.\nThe viewer is not yet thinking about your solution. They are feeling the problem more clearly\nthan they did before they saw the ad.\nThat feeling is what makes everything that follows feel relevant and necessary.\nMoment of Realisation \ud83d\ude2e\nBefore you introduce the result, the viewer needs one more thing - clarity.\nUp to this point they are feeling the problem more intensely. But they may still believe the\ncause of the problem is something else such as their effort, their timing, the platform, or\nsimply bad luck.\nThis is where you introduce the insight.\nYou reveal the misunderstanding, the hidden cause, or the flawed assumption that has been\nkeeping the problem in place.\nThe viewer suddenly sees the situation differently. The problem is no longer random or\nconfusing. It has a clear reason behind it.\nThat moment of understanding is powerful. When people understand why something is\nhappening, they become far more open to hearing how it can be fixed.\nNow the outcome you describe does not feel like a sales pitch. It feels like the logical result\nof finally addressing the real problem.\nOutcome \ud83d\udcc8\nNow you introduce the contrast.\nYou paint a picture of what life looks like when the problem is solved. Not a fantasy. A\nbelievable, specific version of the result your offer produces.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nThis is where you build desire.\nThe more specific the outcome, the more believable it is.\nVague promises create scepticism. Specific results create belief. \"You will get more leads\"\ndoes not do the same job as \"Our clients average 34 qualified leads in their first 30 days.\"\nUnique Mechanism \ud83d\udee0\nThis is where you explain how the outcome is achieved.\nWhat is it about your offer, system, or method that makes the result possible? Why does it\nwork when other things have not?\nThe unique mechanism answers the question the viewer is already asking: okay, but how? It\nis not a features list.\nIt is a simple, clear explanation of the core thing that makes your solution different and\neffective.\nIf the viewer can understand why your approach works in two to three sentences, the next\nstep feels logical rather than risky.\nSocial Proof \u2b50\u2b50\u2b50\u2b50\u2b50\nSocial proof transfers belief from you to the people the viewer already trusts: other\ncustomers.\nTestimonials, case studies, client results, volume of customers, or named outcomes all serve\nthe same purpose.\nThey show that the result you described in the Outcome section has already happened for\nreal people.\nKeep social proof specific and credible. A named result from a real client is more powerful\nthan a vague endorsement.\nWhere possible, match the proof to the angle \u2014 if your angle speaks to a specific type of\nperson or problem, your social proof should reflect that same person and problem.\nCall To Action \u261e\nThe call to action tells the viewer exactly what to do next and removes any uncertainty about\nwhat happens when they do it. It should be direct, specific, and friction-free.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWeak CTAs create hesitation. \"Find out more\" is vague. \"Click below to book your free\n30-minute strategy call\" tells the viewer exactly what they are clicking, what they are getting,\nand what the commitment is. The simpler and more specific the next step, the more likely\nthey are to take it.\nCreating Your Scripts \u270f\nNow I'm going to show you exactly how we can build these.\nWe\u2019re going to take your offer, your angle and your hooks and feed them into a structured\nGPT setup that builds the script for you\nI\u2019m going to show you exactly how to set this up so that:\n- The angle stays intact.\n- The hook stays intact.\n- The problem maps directly to your worksheet.\n- The final script actually sounds like a human explaining something clearly\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\n\n=== SOURCE: (IA) Video 6 - Direct Response & Copy Psychology.docx.pdf ===\nModule 3 - Direct Response & Copy Psychology\nClick here for Google Doc (Click File > Make a Copy)\nIntroduction \u25b6\nIn this lesson we are going to go deeper on what makes our copy actually convert.\nMost ad copy fails but because it does not understand the psychology of the person reading\nit, and it leaves too much room for doubt.\nPeople scroll fast, think in shortcuts, and make decisions in seconds. We need to write copy\nto work with that, not against it.\nIn this lesson we are going to cover two things that will immediately improve the quality of\neverything you write.\n1 - the psychological triggers that move people from attention to action.\n2 - the direct response principles that remove friction, ambiguity, and doubt from your copy\nso the right person has no reason not to click.\nBy the end of this lesson you should be able to look at any piece of copy, identify exactly\nwhy it is underperforming, and know how to fix it.\nPsychological Triggers \ud83e\udde0\nPsychological triggers are the specific mechanisms that move a person from passive interest\nto active intent.\nThey do not manufacture desire.\nThey amplify desire that already exists.\nWhen someone sees your ad, they may already want the outcome you are offering.\nThe triggers are what make them feel the need to act now rather than scrolling past and\nforgetting about it.\nSocial Proof \u2705\nSocial proof is one of the most powerful conversion tools available in ad copy. People are\nwired to trust the decisions of others.\nWhen someone sees that people like them have already achieved the result being promised,\nthe believability of the offer increases dramatically.\nEffective social proof in ad copy is specific, not generic\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nYou need to include real numbers, real outcomes, and where possible, real names or\nidentifiable details.\nCompare these two examples.\nWeak: \"Our clients love us and get great results.\"\nStrong: \"Sarah, a wedding photographer from Leeds, booked 11 clients in her first 6 weeks.\"\nThe second version is specific, grounded, and instantly more believable.\nWhen using social proof, always try to match it to the angle.\nIf your angle speaks to a specific pain point or type of person, your proof should reflect that\nsame person and that same result.\nAuthority \ud83d\udcdb\nAuthority shows the reader that you are qualified to deliver the result you are promising.\nIt answers the question they are already asking: why should I trust this person?\nAuthority can come from many places.\n- Years of experience.\n- Number of clients served.\n- Featured in or recognised by known organisations.\n- Specific certifications or credentials.\n- Volume of results produced.\nThe key is that it feels earned and verifiable, not claimed.\n\"Industry-leading\" is vague and means nothing.\n\"We have helped 1,400 agency owners across 14 countries\" is quantifiable.\nUse authority sparingly and specifically.\nOne or two credibility signals placed in the right moment of the copy are more effective than\na paragraph of credentials that feels like a CV.\nUrgency \u26a1\nUrgency creates a reason to act now rather than later. Without it, interested viewers intend to\ncome back, and they rarely do.\nDefault human behaviour is to defer. Urgency disrupts that default.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nUrgency works when it is real.\nManufactured urgency like fake countdown timers, offers that are always expiring can\ndamage trust the moment the reader notices it.\nReal urgency comes from genuine constraints:\n- Intake closing on a specific date,\n- Live cohort starting soon\n- Limited number of onboarding slots available this month.\nWhen you have genuine urgency, state it directly and specifically.\n\"Doors close Friday\" is more effective than \"Limited time only.\"\nA concrete deadline is going to feel much more real to the reader.\nScarcity \u26a0\nScarcity works on the same principle as urgency but applies to availability rather than time.\nWhen people believe something is limited, they assign it more value.\nWhen supply feels unlimited, the pressure to act disappears.\nLike urgency, scarcity must be real to be effective.\nIf you take on a limited number of clients per month because you have a finite onboarding\ncapacity, say so.\n\"We only onboard 8 new clients per month\" is credible and specific.\n\"Spots are limited\" is tired and unbelievable.\nLoss Aversion \ud83d\udcb0\nPeople are more motivated by the prospect of losing something than they are by the\nprospect of gaining the same thing.\nThis is one of the most well-documented principles in behavioural psychology and it has a\ndirect application in ad copy.\nMost copy is written around what the reader will gain.\nLayer in what they will continue to lose by not acting;\n- time\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n- money,\n- clients,\n- competitive advantage\nThis can significantly increase the emotional weight of your message.\nThe problem agitation section of your ad structure is the natural place for this.\nBe careful with how you apply this. Loss framing that feels manipulative or exaggerated will\ndamage trust.\nWhen the cost of inaction is real and relevant, stating it directly is honest and effective.\nWhen it is inflated, it reads as pressure and people disengage.\nSpecificity \ud83c\udfaf\nSpecific claims are more believable than general ones.\nThis is a core function of how credibility works.\nVague promises sound like marketing.\nSpecific outcomes sound like evidence.\nCompare:\n\"Generate more leads for your business\"\nversus\n\"Generate 30 to 50 qualified leads per month without cold calling.\"\nThe second version creates a picture and sounds like something that has actually happened.\nIt is also more useful to the reader because they can assess whether it is relevant to their\nsituation.\nWherever you make a claim in your copy, ask whether you can make it more specific.\n- Replace percentages with numbers.\n- Replace time ranges with specific timeframes.\n- Replace outcomes with the actual result.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nDirect Response Principles (cid:0)\nDirect response copywriting is a discipline built around one objective: getting the reader to\ntake a specific action.\nEvery principle in this section is designed to help you build these into your own copy.\nWhen you apply them your copy will become faster to read, easier to act on, and harder to\nignore.\nRemove All Ambiguity \ud83d\udcad\nIf a sentence can be interpreted in more than one way, rewrite it.\nAmbiguity forces the reader to think, and the moment they have to think, they are deciding\nwhether to continue. Most of the time, they do not.\nEvery claim, every instruction, and every outcome in your copy should have exactly one\nmeaning.\nRead each sentence and ask: could this be misread? Could someone understand this\ndifferently to how I intended it?\nIf the answer is yes, simplify it.\nWrite As If It Is 100% For This Reader \ud83d\udd8a\nGood ad copy does not say \"this may work for you\" or \"some of our clients find that.\"\nIt speaks directly and confidently to one person as though the entire ad was written\nspecifically for them.\nWhen you write with these qualifications, it sounds like you are trying to avoid making a\npromise you cannot keep.\nThe result is your copy sounds uncertain and unconvincing.\nInstead, write to the ideal reader as if the result you are describing is their guaranteed reality.\nYour angle has already done the work of attracting the right person so our ad copy needs to\nspeak to them directly and with conviction.\nUse Quantitative Numbers \ud83d\udd23\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nNumbers do three things in copy.\n1. They replace vague language with something concrete.\n2. They signal that the claim is based on real data.\n3. They are faster to process than descriptive language.\nGo through every vague descriptor in your ad copy and replace each one with the most\nspecific number you can honestly use.\nInstead of\u2026\n\"faster results\"\nwrite:\n\"results in 14 days.\"\nInstead of\u2026\n\"hundreds of clients\"\nwrite:\n\"over 400 clients.\"\nInstead of \"significantly lower costs\"\nwrite\n\"cost per lead reduced by 40%.\"\nIf you use too many of these vague terms; faster, better, more effective they add little value\nand can signal low credibility.\nTell People Exactly What They Will Gain \ud83d\udcaa\nDo not make the reader work out what they get from your offer.\nState it directly, specifically, and early.\nThe outcome section of your ad structure is designed for this, but the principle applies\nacross the whole ad.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share,
