 copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nDescribe the outcome in terms the reader already uses to think about their problem.\nDon\u2019t use internal language or industry terminology, but the exact words they would use to\ndescribe what they want.\nIf your clients say \"I want more booked calls\" then write \"more booked calls,\" not \"increased\npipeline velocity.\"\nClarity Over Cleverness \ud83e\udd2f\nWe need to make sure we are writing in a way that's easy for the reader to understand.\nWordplay, metaphors, and indirect language all slow comprehension.\nIn an environment where you have under two seconds to earn attention, anything that\nrequires the reader to decode what you are actually trying to say is an issue.\nThe best direct response copy is almost boring because it's so direct.\nIt says exactly what it means in the simplest language available.\nIf you find yourself proud of a line because it is clever, read it again and ask whether it is\nclear.\nUsually you will find you can make it shorter and more direct without losing anything.\nUse Active Voice \ud83d\udcac\nActive voice puts the subject first and the action second.\nIt is direct, fast, and confident.\nPassive voice reverses this and produces copy that feels slow, weak, and uncertain.\nPassive: \"Results have been achieved by our clients across multiple industries.\"\nActive: \"Our clients get results across every industry we work in.\"\nA good way to check if there is an issue is to read your copy out loud.\nIf a sentence sounds like it was written for a report, rewrite it in the most direct,\nconversational way possible.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nCopy Review Checklist \ud83d\udccb\nBefore publishing any ad copy, run it against this checklist.\n1. Does the hook immediately signal who this is for?\n2. Is every claim specific and quantified where possible?\n3. Have I removed every sentence that can be interpreted in more than one way?\n4. Am I speaking directly to one person or hedging for a crowd?\n5. Does the copy tell the reader exactly what they will gain and exactly what to do next?\n6. Is there at least one credibility signal; proof, authority, or a specific result?\n7. Have I removed every word that does not add value or impact?\n8. Does it read as fast and clearly out loud as it does on the page?\nIf you can answer yes to all of these, the copy is ready to test.\nSummary \u2705\nPsychological triggers amplify desire that already exists.\nSocial proof transfers belief.\nAuthority earns trust.\nUrgency and scarcity create a reason to act now.\nLoss aversion increases the emotional cost of inaction.\nSpecificity makes every claim more credible.\nNone of these work in isolation and the goal is to layer as many of these as possible into\nyour ad copy so that they have a compound effect.\nThese direct response principles remove every reason for the reader to hesitate.\n- Write without ambiguity.\n- Speak directly to one person. Use numbers.\n- State outcomes clearly.\n- Choose clarity over cleverness.\n- Write in active voice.\nThese principles also apply to everything you write; video scripts, static ad copy, headlines,\nand primary text.\nIn the next lesson I'm going to show you how to apply all of this to static ads specifically and\nlook at how to write a copy for the format.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\n\n=== SOURCE: (IA) Video 7 - Writing Copy For Static Ads.docx.pdf ===\nModule 3 - Writing Copy For Static Ads\nClick here for Google Doc (Click File > Make a Copy)\nIntroduction \u25b6\nIn the last two lessons, we covered hooks and scripts for video ads.\nNow we\u2019re moving into static ads.\nThis is where most people get it wrong.\nThey either copy their video hooks directly into statics, which doesn\u2019t work, or they rely on\nthe image to do everything and treat the copy as an afterthought.\nBoth approaches kill performance.\nStatic ads are not a simplified version of video.\nThey\u2019re a completely different format with a different set of rules.\n- You don\u2019t get time to explain.\n- You don\u2019t get sequence.\n- You don\u2019t get a second chance.\nThe viewer sees everything at once and decides in under two seconds whether this is worth\ntheir attention.\nIf your ad isn\u2019t instantly clear, it gets ignored.\nIn this lesson, we\u2019re going to fix that.\nI\u2019ll show you how static ads are actually consumed, what each element is responsible for,\nand how to build them properly so they work together instead of competing.\nWe\u2019ll break down:\n- Why most static ads fail\n- The five elements that make up a high-performing static\n- How to build the static hook using image, overlay, and headline\n- How to write primary text that actually gets read\n- How to write headlines that drive clicks instead of just describing your offer\nBy the end of this lesson, you\u2019ll be able to take the same angles you\u2019ve already built and turn\nthem into static ads that are clear, fast to understand, and built to convert.\nThis is where we move from \u201cgood looking ads\u201d to ads that actually perform.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nHow Statics Are Consumed Differently To Video \ud83d\uddbc\nUnlike video ads when we are using statics we are unable to control the sequence in which\nthe viewer consumes information.\nIn a Video:\nThe viewer sees the hook first.\nThen the body.\nThen the CTA.\nYou guide them from attention \u2192 understanding \u2192 action, step by step.\nWhen we run statics we aren't able to control this.\nWhen someone scrolls past a static ad, they see everything at once.\nThe image.\nThe text overlay.\nThe headline.\nThe first line of the primary text.\nThere is no sequence or build up. They scan the entire ad in under two seconds and decide:\n\ud83d\udc49 \u201cDo I understand this?\u201d\n\ud83d\udc49 \u201cIs this for me?\u201d\n\ud83d\udc49 \u201cDo I care?\u201d\nIf the answer isn\u2019t immediately clear, they keep scrolling.\nVideo gives you time to explain.\nStatics demand instant clarity.\nThe Anatomy Of A Static Ad \u2699\nA static ad has five elements.\nIf you don\u2019t understand what each one is responsible for, you\u2019ll either overload one part or\nleave performance on the table.\nEach element has a specific job and when they all do their job properly, the ad works.\nWhen one fails, the whole ad underperforms.\nIn a video, the hook is a line.\nIn statistics, the hook is a system.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nImage + Overlay + Headline = the hook.\nEverything starts from the hook you have already created.\nWe don't need to create anything new and can distribute our existing ideas across different\nelements.\nThe 5 Elements \ud83d\udd25\n1. The Image\nThis is your scroll-stopper. It does the same job as the first 1\u20132 seconds of a video.\nIts role is simple:\n\ud83d\udc49 Stop the scroll\n\ud83d\udc49 Signal relevance\n\ud83d\udc49 Represent the angle visually.\nThat\u2019s it. It doesn't need to explain everything.\nIf your hook is about \u201cgoing to the gym and not seeing results\u201d, your image should show that\nsituation.\nA good image makes the right person instantly think:\n\u201cThis is about me.\u201d\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n2. Text Overlay (Optional)\nThis is short copy placed on the image.\nIts job is to be instantly clear, specific, and easy to process.\n\ud83d\udc49 Add clarity\n\ud83d\udc49 Reinforce the angle\n\ud83d\udc49 Support the overall hook\nYour overlay should be built from the same angle and hook you\u2019ve already created.\nYou\u2019re not writing new messaging.\nYou\u2019re taking one part of the hook and expressing it in a way that can be understood in\nunder one second.\nExample Hook:\n\u201cIf you\u2019ve been going to the gym to lose weight and it hasn\u2019t worked\u2026\nhere\u2019s how 100+ people are getting consistent results from home in 4\u20136 weeks.\u201d\nFrom this hook, we can extract:\nThe problem \u2192 the gym isn\u2019t working\nThe audience \u2192 people trying to lose weight\nThe contrast \u2192 gym vs home\nThe result \u2192 consistent results\nYour overlay should take one of these and express it clearly.\nNot all of them. Just one.\nWhat to avoid:\n\u274c \u201cIf you\u2019ve been going to the gym to lose weight and it hasn\u2019t worked\u2026\nhere\u2019s how 100+ people are getting consistent results from home in 4\u20136 weeks.\u201d\n- Too long.\n- Too heavy.\n- Not built for how statics are consumed.\nStronger versions:\n\u2705 \u201cYou train 4x a week and still look the same?\u201d\n\u2705 \u201cWorking out but not seeing any change?\u201d\n\u2705 \u201cPutting in the effort but nothing\u2019s changing?\u201d\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nEach of these comes from the same hook but expresses a different part of it.\nWhen combined with the image and headline, the full idea becomes clear instantly.\nThe hook is the idea.\nThe overlay is one expression of that idea, compressed for speed.\nIf your overlay could apply to any ad in your niche, it\u2019s too generic.\nIf it takes more than a second to read or understand, it\u2019s too heavy.\n3. Headline\nThe headline sits below the creative. This is one of the most important elements in a static\nad and one of the most misused.\nA lot of people use the headline to describe the offer but it\u2019s job is to push the click.\nIn our statics system: Image + Overlay + Headline = Hook\nThe headline is where you introduce the tension, contrast, or question that makes the viewer\nwant to engage.\nWe are not creating a new idea and your headline should be built from the same hook.\nYou are taking another part of that same hook and expressing it in a way that makes the next\nstep feel obvious.\nExample Hook:\n\u201cIf you\u2019ve been going to the gym to lose weight and it hasn\u2019t worked\u2026\nhere\u2019s how 100+ people are getting consistent results from home in 4\u20136 weeks.\u201d\nFrom this hook, we can extract:\nThe problem \u2192 the gym isn\u2019t working\nThe contrast \u2192 gym vs home\nThe result \u2192 consistent results\nThe insight \u2192 what they\u2019re doing isn\u2019t working\nExample Headlines:\n\u201cWhy the gym isn\u2019t working for fat loss\u201d\n\u201cStop relying on the gym to lose weight\u201d\n\u201cHow people are getting results without the gym\u201d\nEach headline expresses a different part of the same idea.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWhen combined with the image and overlay, the full message becomes clear instantly.\nWhat to avoid:\n\u274c \u201cOnline Fitness Coaching Program\u201d\n\u274c \u201c12 Week Transformation Plan\u201d\nThese describe the offer, but on cold/low intent audiences, they don\u2019t create any reason to\nclick.\nThere\u2019s no tension or contrast.\nFor more product-aware audiences, this can be effective.\nIf the viewer already:\n- Knows what they want\n- Is actively looking for a solution\n- Recognises the offer\nThen clarity can outperform curiosity.\nYour headline should match the awareness level.\nCold audiences \u2192 use contrast, problems, tension\nWarmer audiences \u2192 use clarity, outcome, specificity\nBest Practice:\nThe headline should make ignoring the ad feel wrong.\nKeep it short. 6\u201310 words.\nMake it specific.\nThe goal is simple: Take the idea from your hook, and make the next step feel obvious.\n4. Primary Text\nWe don't need to rewrite our main copy at this point. You have done this already in the\nprevious lesson.\nYou already have:\n- Your hook\n- Your script\n- Your structure\nProblem \u2192 Solution\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nBefore \u2192 After \u2192 Bridge\nMyth \u2192 Truth\nFor our statics we don't need to redo this and can use what we already have.\nWe can use our full hook as our first line.\nJust make sure that it fits within the character limits meta gives and can all be seen before\nthe \u2018see more\u2019 button.\nSometimes we might need to condense it slightly.\nThen continue straight into your script. After the first line, everything else stays the same.\nFollow the same structure:\nProblem agitation\nMoment of realisation\nOutcome\nMechanism\nSocial proof\nCall to action\nThe Difference With Statics\nStatic copy is read, not watched so we need to make sure it's polished for easy reading.\n- Shorter sentences\n- Less filler\n- More direct\nThe structure does not change.\nWhat to Avoid:\n\u274c Writing completely new copy for statics\n\u274c Changing the angle or message\n\u274c Overcomplicating the first line\n5. Call To Action (CTA)\nKeep this simple and don\u2019t overthink it. Your CTA should match the action you want:\nLearn More \u2192 lead gen\nSign Up \u2192 lead form\nShop Now \u2192 purchase\nBiggest Mistakes \u26a0\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nThe biggest mistake people make is trying to make one element do everything.\n- Image trying to explain the whole offer\n- Overlay trying to be clever\n- Headline repeating the same idea\n- Primary text carrying all the weight\nThis can make the ad heavy, confusing and hard for viewers to comprehend easily.\nThe Correct Way To Think About It \ud83e\udde0\nEach element has one job:\nImage \u2192 Stop + signal\nOverlay \u2192 Clarify\nHeadline \u2192 Create tension\nPrimary text \u2192 Build belief\nCTA \u2192 Direct action\nWhen this happens the ad becomes easier to understand, easier to process and harder to\nignore.\nQuick Test\nLook at your ad and ask:\nIs the image clear instantly?\nDoes the overlay add clarity or noise?\nDoes the headline create curiosity or just describe?\nDoes the first line hit immediately?\nIf any part is weak you should go back and correct it.\nThe Static Hook System \u2693\nBecause a static is consumed all at once, the hook is not a single element. It is the\ncombination of the image, the text overlay, and the headline working as one unit.\nThink of it as a three-part system where each component has a specific role.\nThe image stops the scroll and signals the angle. It should visually represent the problem,\nthe outcome, or the transformation the ad is communicating.\nIt does not need to be complicated. It needs to be immediately readable and relevant to the\nperson you are trying to attract.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nThe text overlay adds clarity to the image. It answers the question the viewer is already\nasking: what is this about? Keep it to a few words.\nWrite it to be read in under one second. Avoid full sentences. Think of it as a label, not a line\nof copy.\nThe headline delivers the contrast or the question.\nThis is where you introduce the idea that makes the viewer want to keep reading. Use it to\nchallenge what they already believe, highlight an unexpected result, or ask a direct question\nthey cannot ignore.\nThis is the element that creates forward momentum into the primary text.\nA simple way to think about the three parts together: the image says who this is for, the\noverlay says what it is about, and the headline gives them a reason to read more.\nWriting Primary Text For Statics \u270f\nThe primary text is where you build the case. The same three frameworks we used for video\nscripts (Problem to Solution, Before After Bridge, and Myth to Truth) apply here. The\ndifference is in how you write them.\nStatic copy is written to be read, not heard. This means;\n- Shorter sentences.\n- Simpler words.\n- No conversational filler.\nIn a video script you can afford transitions and breathing room because the viewer is\nwatching.\nIn a static the viewer is reading at their own pace, often while scrolling, and you lose them\nthe moment the copy becomes dense or effortful.\nThe most important rule for primary text: lead with your strongest idea.\nThe first line must do the most work. It is visible before the See More cut, which means it is\noften the only line that gets read.\nIf that first line does not give the viewer a clear reason to keep reading, the rest of the copy\nis invisible.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nA strong opening line for static primary text identifies the specific person the ad is for, names\ntheir problem or desire directly, and does it in as few words as possible. The goal is to make\nthe right person immediately think: this is about me.\nFrom there, the body of the primary text follows whichever framework matches the angle.\nProblem to Solution works well for pain-led angles where the viewer already knows they\nhave the problem.\nBefore After Bridge works well for transformation angles where you want them to feel the\ncontrast emotionally.\nMyth to Truth works well for objection or identity angles where you need to shift a belief\nbefore they will consider the offer.\nKeep the overall length focused. Static primary text does not need to be long. Two to four\nshort paragraphs is usually enough.\nEnd with a clear, direct call to action that tells the viewer exactly what to do next and why.\nWriting Headlines That Drive Clicks \u270f\nThe headline is the last thing the viewer sees before they decide whether to click. Most\nadvertisers treat it as an afterthought, usually defaulting to their brand name or a vague\ndescription of the offer. This is a significant missed opportunity.\nA strong headline does one of three things. It delivers a clear, specific benefit that makes the\noffer immediately appealing.\nIt asks a direct question the viewer cannot help but answer yes to. Or it creates a specific\ncontrast that makes the offer feel like the obvious next step.\nHeadlines need to be short. Meta displays them in a limited space and long headlines get\ntruncated. Aim for six to ten words as a general rule. Every word should earn its place. If you\ncan remove a word without losing the meaning, remove it.\nThe headline and the primary text should not repeat each other. They are doing different\njobs. The primary text builds the case. The headline closes it. Think of the headline as the\nlast nudge before the click, not a summary of everything you just said.\nJust like with video hooks and angles, you should test multiple headline variations against\nthe same creative. The image and primary text can stay the same while you test two or three\ndifferent headlines. Small changes here can have a meaningful impact on CTR without\nrequiring new creative production.\nPutting It Together \u2699\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\nWhen briefing or writing a static ad, work through the five elements in this order.\nStart with the angle. Every decision flows from this. Know who you are targeting, what\nproblem or desire you are speaking to, and what the core idea of the ad is before you write a\nsingle word.\nBrief the image. Describe what you need visually in terms of who it should feature, what it\nshould communicate, and what emotion or situation it should convey. Be specific. A vague\nbrief produces a vague image.\nWrite the text overlay if needed. Three to seven words. Clarity over cleverness. It should\nmake the image more immediately readable, not compete with it.\nWrite the primary text. Lead with your strongest line. Follow the framework that suits the\nangle. End with a clear call to action. Keep it focused.\nWrite two or three headline variations. Make each one do something specific: benefit,\nquestion, or contrast. Test them and let the data tell you which lands.\nSummary \u2705\nStatic ads are consumed differently to video. Everything is visible at once, which means\nevery element has to work immediately and independently. There is no sequence to build in.\nClarity and relevance have to be instant.\nThe static hook is a system of three parts: the image stops the scroll, the text overlay adds\nclarity, and the headline creates the question or contrast that drives the click. These three\nelements work together as one unit.\nPrimary text follows the same frameworks as video scripts but is written to be read rather\nthan heard. Lead with your strongest line. Keep sentences short. End with a direct call to\naction.\nHeadlines are where CTR on statics is won or lost. Treat them as a testing variable in their\nown right. Keep them short, specific, and focused on benefit, question, or contrast.\n\u00a9 Imperium Acquisition - All rights reserved. Do not share, copy, reproduce or sell any part of this document unless you have written permission from Imperium Labs LTD. All infringements will be\nprosecuted. If you are the personal owner of the Imperium Labs LTD End User Licence then you may use it for your own use but not for any other purpose.\n\n\n=== SOURCE: (IA) Meta_Ad_Hooks_Worksheet [Master] - Template.csv ===\nClick File > Make a copy to save your own version of this worksheet,,,,,,,,\nAngle 1 ,,Angle 2,,Angle 3,,Angle 4,,Angle 5\nCopy and paste your angle here,,Copy and paste your angle here,,Copy and paste your angle here,,Copy and paste your angle here,,Copy and paste your angle here\n\"Subject:\nWho the ad is about\",,\"Subject:\nWho the ad is about\",,\"Subject:\nWho the ad is about\",,\"Subject:\nWho the ad is about\",,\"Subject:\nWho the ad is about\"\n\"Action:\nWhat they are doing or trying to do\",,\"Action:\nWhat they are doing or trying to do\",,\"Action:\nWhat they are doing or trying to do\",,\"Action:\nWhat they are doing or trying to do\",,\"Action:\nWhat they are doing or trying to do\"\n\"Outcome / Result:\nThe end state they want. Express this outcome as an emotional benefit when possible.\",,\"Outcome / Result:\nThe end state they want\",,\"Outcome / Result:\nThe end state they want\",,\"Outcome / Result:\nThe end state they want\",,\"Outcome / Result:\nThe end state they want\"\n\"Contrast:\nWhy the old way fails / what makes this different\",,\"Contrast:\nWhy the old way fails / what makes this different\",,\"Contrast:\nWhy the old way fails / what makes this different\",,\"Contrast:\nWhy the old way fails / what makes this different\",,\"Contrast:\nWhy the old way fails / wha const SYSTEM_PROMPT = `You are a senior Meta ad copywriter trained in the Imperium Acquisition (IA) creative framework by Charlie Morgan. Your job is to generate structured creative briefs for Meta lead gen campaigns.

You have been given the complete IA framework documentation below. You MUST follow this framework exactly — do not invent your own approach or deviate from the methodology.

${KNOWLEDGE_BASE}

4. Hooks must be exactly 2 sentences: Sentence 1 = Clarity (Subject + Action + Outcome), Sentence 2 = Curiosity/Contrast
5. Write at 6th grade reading level, use "you/your" not "I/me", active voice, no clichés
6. Social proof must use the client's actual provided data — do not invent names or numbers if none provided

function getBadgeClass(angleType) {
  const map = { Pain: 'badge-pain', Benefit: 'badge-benefit', Objection: 'badge-objection', Challenge: 'badge-challenge', Identity: 'badge-identity' };
  return map[angleType] || 'badge-default';
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.classList.add('copied');
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 2000);
  });
}

function buildBriefText(b) {
  return `BRIEF #${b.briefNumber} — ${b.angleType.toUpperCase()}: ${b.angleDescription}
NARRATIVE FRAMEWORK: ${b.narrativeFramework}

HOOK:
${b.hook.sentence1}
${b.hook.sentence2}

FULL AD COPY:
Problem Agitation: ${b.fullAdCopy.problemAgitation}
Moment of Realisation: ${b.fullAdCopy.momentOfRealisation}
Outcome: ${b.fullAdCopy.outcome}
Unique Mechanism: ${b.fullAdCopy.uniqueMechanism}
Social Proof: ${b.fullAdCopy.socialProof}
CTA: ${b.fullAdCopy.cta}

STATIC AD ELEMENTS:
Image Direction: ${b.staticAdElements.imageDirection}
Text Overlay: ${b.staticAdElements.textOverlay}
Headline Option 1: ${b.staticAdElements.headlines[0] || ''}
Headline Option 2: ${b.staticAdElements.headlines[1] || ''}
Headline Option 3: ${b.staticAdElements.headlines[2] || ''}
Primary Text: ${b.staticAdElements.primaryText}

HIGGSFIELD IMAGE PROMPT:
${b.higgsfieldPrompt}`;
}

function renderBriefs(briefs) {
  const out = document.getElementById('output');
  let html = `<div class="briefs-header"><h2>Generated Briefs</h2><span>${briefs.length} briefs · ${new Date().toLocaleTimeString()}</span></div>`;
  
  briefs.forEach((b, i) => {
    const badgeClass = getBadgeClass(b.angleType);
    const fullText = buildBriefText(b);
    const higgsfieldText = b.higgsfieldPrompt;
    
    html += `
    <div class="brief-card">
      <div class="brief-header">
        <h3>Brief #${b.briefNumber} — ${escapeHtml(b.angleDescription)}</h3>
        <span class="brief-badge ${badgeClass}">${escapeHtml(b.angleType)}</span>
      </div>
      <div class="brief-body">
        
        <div class="brief-section">
          <div class="section-label">Narrative Framework</div>
          <span class="framework-tag">${escapeHtml(b.narrativeFramework)}</span>
        </div>

        <div class="brief-section">
          <div class="section-label">Hook</div>
          <p class="hook-text">
            <span class="hook-s1">${escapeHtml(b.hook.sentence1)}</span><br>
            <span class="hook-s2">${escapeHtml(b.hook.sentence2)}</span>
          </p>
        </div>

        <div class="brief-section">
          <div class="section-label">Full Ad Copy</div>
          <div class="copy-block">
            <div class="copy-row"><div class="copy-row-label">Problem Agitation</div><div class="copy-row-text">${escapeHtml(b.fullAdCopy.problemAgitation)}</div></div>
            <div class="copy-row"><div class="copy-row-label">Moment of Realisation</div><div class="copy-row-text">${escapeHtml(b.fullAdCopy.momentOfRealisation)}</div></div>
            <div class="copy-row"><div class="copy-row-label">Outcome</div><div class="copy-row-text">${escapeHtml(b.fullAdCopy.outcome)}</div></div>
            <div class="copy-row"><div class="copy-row-label">Unique Mechanism</div><div class="copy-row-text">${escapeHtml(b.fullAdCopy.uniqueMechanism)}</div></div>
            <div class="copy-row"><div class="copy-row-label">Social Proof</div><div class="copy-row-text">${escapeHtml(b.fullAdCopy.socialProof)}</div></div>
            <div class="copy-row"><div class="copy-row-label">CTA</div><div class="copy-row-text">${escapeHtml(b.fullAdCopy.cta)}</div></div>
          </div>
        </div>

        <div class="brief-section">
          <div class="section-label">Static Ad Elements</div>
          <div class="static-grid">
            <div class="static-item" style="grid-column: 1 / -1;">
              <div class="static-item-label">Image Direction</div>
              <div class="static-item-text">${escapeHtml(b.staticAdElements.imageDirection)}</div>
            </div>
            <div class="static-item">
              <div class="static-item-label">Text Overlay</div>
              <div class="static-item-text" style="font-size:16px; font-weight:700; color:#fff;">${escapeHtml(b.staticAdElements.textOverlay)}</div>
            </div>
            <div class="static-item">
              <div class="static-item-label">Headlines</div>
              <div class="static-item-text">${(b.staticAdElements.headlines || []).map((h, i) => `<div style="margin-bottom:4px"><span style="color:#555;font-size:11px;">${i+1}.</span> ${escapeHtml(h)}</div>`).join('')}</div>
            </div>
            <div class="static-item" style="grid-column: 1 / -1;">
              <div class="static-item-label">Primary Text</div>
              <div class="static-item-text">${escapeHtml(b.staticAdElements.primaryText)}</div>
            </div>
          </div>
        </div>

        <div class="brief-section">
          <div class="section-label">Higgsfield Image Prompt</div>
          <div class="higgsfield-box">
            <div class="higgsfield-text">${escapeHtml(b.higgsfieldPrompt)}</div>
          </div>
        </div>

        <div class="brief-actions">
          <button class="btn-copy" id="copy-full-${i}" onclick="copyToClipboard(briefsData[${i}].fullText, this)">Copy Full Brief</button>
          <button class="btn-copy-prompt" id="copy-prompt-${i}" onclick="copyToClipboard(briefsData[${i}].higgsfieldText, this)">Copy Higgsfield Prompt</button>
        </div>

      </div>
    </div>`;
  });
  
  out.innerHTML = html;
  
  // Store data for copy buttons
  window.briefsData = briefs.map(b => ({
    fullText: buildBriefText(b),
    higgsfieldText: b.higgsfieldPrompt
  }));
}

async function generateBriefs() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { alert('Please enter your Anthropic API key.'); return; }

  const fields = {
    businessName: document.getElementById('businessName').value.trim(),
    industry: document.getElementById('industry').value.trim(),
    location: document.getElementById('location').value.trim(),
    service: document.getElementById('service').value.trim(),
    result: document.getElementById('result').value.trim(),
    socialProof: document.getElementById('socialProof').value.trim(),
    usps: document.getElementById('usps').value.trim(),
    painPoints: document.getElementById('painPoints').value.trim(),
    objections: document.getElementById('objections').value.trim(),
    audience: document.getElementById('audience').value.trim(),
    tone: document.getElementById('tone').value,
  };

  const required = ['businessName', 'industry', 'service', 'result', 'painPoints', 'audience'];
  const missing = required.filter(f => !fields[f]);
  if (missing.length) { alert('Please fill in: ' + missing.join(', ')); return; }

  const btn = document.getElementById('generateBtn');
  const out = document.getElementById('output');
  btn.disabled = true;
  btn.textContent = 'Generating...';
  out.innerHTML = `<div class="loading"><div class="loading-spinner"></div><p>Generating 6 creative briefs using the IA framework...</p><p style="margin-top:8px;font-size:12px;color:#444;">This takes 30-60 seconds</p></div>`;

  const userMessage = `Generate 6 Meta ad creative briefs for the following client:

Business Name: ${fields.businessName}
Industry / Niche: ${fields.industry}
Location: ${fields.location}
What They Sell: ${fields.service}
The Result Clients Get: ${fields.result}
Social Proof: ${fields.socialProof || 'Not provided — do not invent specific names or numbers'}
USPs / Differentiators: ${fields.usps || 'Not provided'}
Customer Pain Points (in their words): ${fields.painPoints}
Objections They Hear: ${fields.objections || 'Not provided'}
Audience Description: ${fields.audience}
Tone Preference: ${fields.tone || 'Not specified — use professional-casual'}

Follow the IA framework strictly. Return only the JSON array.`;

  try {
    const response = await fetch('/.netlify/functions/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey,
        payload: {
          model: 'claude-sonnet-4-5',
          max_tokens: 6000,
          system: SYSTEM_PROMPT,
          messages: [{ role: 'user', content: userMessage }]
        }
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `API error ${response.status}`);
    }

    const data = await response.json();
    const rawText = data.content[0].text.trim();
    
    let briefs;
    try {
      // Handle if model wraps in markdown
      const jsonStr = rawText.startsWith('[') ? rawText : rawText.replace(/^```json?\n?/, '').replace(/\n?```$/, '');
      briefs = JSON.parse(jsonStr);
    } catch (e) {
      throw new Error('Failed to parse response as JSON. Raw response: ' + rawText.slice(0, 200));
    }

    renderBriefs(briefs);
  } catch (err) {
    out.innerHTML = `<div class="error"><strong>Error:</strong> ${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate Creative Briefs →';
  }
}

// Allow Enter key in single-line inputs to trigger generation
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.id !== 'apiKey') {
    generateBriefs();
  }
});
